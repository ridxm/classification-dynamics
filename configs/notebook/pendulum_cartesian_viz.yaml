# Pendulum Cartesian notebook visualization and analysis configuration
# This config contains ALL parameters used in notebooks - no hardcoded values!

# ============================================================================
# DATA PATHS (all in shared directory)
# ============================================================================
data:
  data_dir: /common/users/shared/pracsys/genMoPlan/data_trajectories/pendulum_cartesian_50k
  trajectories_dir: /common/users/shared/pracsys/genMoPlan/data_trajectories/pendulum_cartesian_50k/trajectories
  roa_labels_file: /common/users/shared/pracsys/genMoPlan/data_trajectories/pendulum_cartesian_50k/roa_labels.txt
  shuffled_indices_file: /common/users/shared/pracsys/genMoPlan/data_trajectories/pendulum_cartesian_50k/shuffled_indices.txt
  checkpoint_path: outputs/pendulum_cartesian_classifier/best.ckpt
  
  # Data loading parameters
  train_size: 1000  # Number of trajectories for training
  val_size: 500     # Number of trajectories for validation

# ============================================================================
# TRAINING PARAMETERS
# ============================================================================
training:
  batch_size: 512        # Batch size for training
  learning_rate: 0.001   # Learning rate (matches training config)
  num_epochs: 50         # Number of epochs to train

# ============================================================================
# MODEL ARCHITECTURE (matches training config)
# ============================================================================
model:
  input_dim: 4           # State dimension: [x, y, x_dot, y_dot] or similar
  hidden_dims: [64, 128, 64, 32]  # Hidden layer sizes
  output_dim: 2          # Binary classification
  dropout: 0.3           # Dropout probability

# ============================================================================
# VISUALIZATION PARAMETERS
# ============================================================================
viz:
  figsize: [12, 8]       # Figure size (width, height) in inches
  dpi: 150               # Resolution for saved figures
  
  # Phase space visualization
  phase_space:
    x_lim: [-2.0, 2.0]   # X position bounds
    y_lim: [-2.0, 2.0]   # Y position bounds
    grid_resolution: 100 # Grid points per dimension
    x_label: "X Position"
    y_label: "Y Position"
    colormap: viridis    # Color scheme for plots

# ============================================================================
# ANALYSIS PARAMETERS
# ============================================================================
analysis:
  num_samples: 1000      # Number of samples for analysis
  batch_size: 256        # Batch size for evaluation
  confidence_threshold: 0.5  # Classification threshold


