# @package _global_

defaults:
  - system: mountain_car
  - model: classifier_medium
  - data: mountain_car_data
  - optimizer: adam
  - device: gpu0
  - _self_

# Experiment name
name: mountain_car_classifier
seed: 42

# Training parameters
batch_size: 256
base_lr: 1e-3

# Model configuration (will use input_dim from system)
model:
  _target_: src.models.classifier.Classifier
  input_dim: ${system.state_dim}
  hidden_dims: [128, 256, 128, 64]
  output_dim: 2
  dropout: 0.3
  use_batch_norm: true

# Optimizer (partial - will be completed with model params)
optimizer:
  _target_: torch.optim.Adam
  _partial_: true
  lr: ${base_lr}

# PyTorch Lightning Trainer
trainer:
  _target_: pytorch_lightning.Trainer
  max_epochs: 100
  accelerator: ${device.accelerator}
  devices: ${device.devices}
  enable_progress_bar: true
  enable_model_summary: true
  log_every_n_steps: 50
  val_check_interval: 1.0
  callbacks:
    - _target_: pytorch_lightning.callbacks.ModelCheckpoint
      monitor: val_loss
      mode: min
      save_top_k: 1
      filename: best
      save_last: true
    - _target_: pytorch_lightning.callbacks.EarlyStopping
      monitor: val_loss
      mode: min
      patience: 10
      verbose: true

# Training module (ClassifierModule)
training_module:
  _target_: src.training.classifier_module.ClassifierModule

# Hydra output directory
hydra:
  run:
    dir: outputs/${name}/${now:%Y-%m-%d_%H-%M-%S}

